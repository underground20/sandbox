services:
    php-cli:
        build:
            context: ./docker/php-cli
        volumes:
            - ./:/var/www/app
        environment:
            PHP_IDE_CONFIG: serverName=${SERVER_NAME}
        env_file:
            - .env
        tty: true
        extra_hosts:
            - "host.docker.internal:host-gateway"
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        env_file:
            - .env
        volumes:
            - db:/var/lib/postgresql/data
            - ./sql/dump:/dump
        ports:
            - "54321:5432"
volumes:
    db:
